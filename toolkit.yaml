name: heptapod
version: 2.3.0
description: An open-source agentic toolkit for high-energy physics.
author: Tony Menzo
license: GPL-3.0
category: hep
python_version: '3.12'
keywords: []
config:
  - name: base_directory
    description: Working directory used by tools for output, sandboxing,
      and findings. Most heptapod tools resolve relative paths against this
      root. Defaults to the directory the harness (Claude Code, Codex,
      Orchestral, ...) launched `tb serve` from; pin per-project with
      `tb config set heptapod base_directory <path> --project`.
    type: path
    required: true
    default: ${CWD}
  - name: mg5_path
    description: Absolute path to the MG5_aMC install dir containing bin/mg5_aMC.
      Required for the mg5 bundle.
    type: path
    required: false
  - name: feynrules_path
    description: Path to the FeynRules installation root. Required for the
      feynrules bundle.
    type: path
    required: false
  - name: wolframscript_path
    description: Command or absolute path to wolframscript. Required for
      the feynrules bundle and the eda bundle's Wolfram-backed tools.
    type: path
    required: false
  - name: cache_enabled
    description: Enable INSPIRE query caching.
    type: boolean
    default: false
  - name: blank_agent_cmd
    description: Command template for the blank-slate agent the reverse bundle
      spawns. The agent runs in an empty directory with no MCP tools and no
      history, so it can only see the sanitized model file. Token {output} is
      the path the CLI writes its final message to; token {prompt} is the
      prompt text, and if absent the prompt is appended as the last argument.
      Any CLI agent works, for example `codex exec --sandbox read-only
      --output-last-message {output}` or `claude -p --output-format text`.
      Required for the reverse bundle.
    type: string
    required: false
bundles:
  # ── lightweight / always-available ───────────────────────────────
  units: {}                              # pure python; nothing to install
  inspire: {}                            # uses requests (always-installed base)
  pdg:
    deps: [pdg>=0.2.0]                   # PDG database API
  # arXiv search, PDF download and full-text extraction. INSPIRE indexes the
  # metadata but serves neither the PDF nor the LaTeX source, which is what
  # the extraction step actually reads.
  literature:
    deps: [pymupdf>=1.24.0]              # requests is in the always-installed base

  # ── BSM model building: paper -> .fr -> UFO -> checked model ─────
  # Read a paper, write a FeynRules model, prove the tool chain accepts it,
  # then have an independent agent read the model back and compare it to the
  # paper. Each stage is its own bundle so a user can install only what they
  # need; none of them requires Mathematica except through the feynrules
  # bundle, which already gates on feynrules_path and wolframscript_path.
  #
  # Paper text -> structured FeynRulesModel via an LLM. Providers (ollama,
  # openai, ...) are optional runtime deps, so nothing is pinned here.
  extract: {}
  # Structured spec -> FeynRules .fr source. No Mathematica needed.
  frgen:
    deps: [jinja2>=3.1.0]                # pydantic comes via the orchestral base
  # Blank-slate reverse check: an independent agent reconstructs the physics
  # from the sanitized .fr alone, then a second one compares it to the paper.
  # Spawns the CLI named by blank_agent_cmd; pure python otherwise.
  reverse: {}
  # Structured provenance ledger (audit.json) for end-to-end runs; pure python.
  logging: {}
  # Background jobs: run long tools (UFO compiles, MadGraph, reverse checks)
  # as detached processes, poll them, collect results. Pure python.
  jobs: {}

  # ── analysis stack ───────────────────────────────────────────────
  analysis:
    deps: [numpy>=2.3.5, tqdm>=4.67.0, pylhe>=1.0.2]

  # ── BSM / SUSY spectrum setup ────────────────────────────────────
  # Pure python (no external HEP software): parse benchmark-point spectra
  # and build Pythia decay-table fragments for BSM states the LHE leaves
  # stable. The experimental model is carried by the inputs, not the tools.
  bsm: {}

  # ── event generation ─────────────────────────────────────────────
  # Pythia + Sherpa share heavy MC dependencies.
  event_gen:
    deps:
      - pythia8mc>=8.316.0
      - sherpa-mc>=3.0.3b1
      - pylhe>=1.0.2
      - numpy>=2.3.5
      - tqdm>=4.67.0
  # MadGraph is split out: it needs a separate external install (mg5_path)
  # and the Python wrapper has no heavy pip deps of its own (it subprocess
  # invokes `bin/mg5_aMC`). Gated on mg5_path being configured. `six` is
  # declared here because mg5_aMC's own python helpers import it at runtime,
  # and MG5 runs under this toolkit's venv interpreter — without it the
  # generation aborts ("madgraph requires the six module").
  mg5:
    requires: [mg5_path]
    deps: [six]

  # ── diagram analysis (NDA) ───────────────────────────────────────
  nda:
    deps: [feyngraph]                    # for EnumerateDiagramsTool, VisualizeDiagramsTool

  # ── exact symbolic amplitudes via Mathematica/FeynCalc ───────────
  eda:
    requires: [wolframscript_path]
    deps: [sympy>=1.14.0]

  # ── BSM model UFO generation via Mathematica/FeynRules ───────────
  feynrules:
    requires: [feynrules_path, wolframscript_path]
tools:
  - module: tools.analysis.conversions
    name: EventJSONLToNumpyTool
    description: Convert a JSONL event dataset into a zero-padded NumPy array.
    bundle: analysis
  - module: tools.analysis.conversions
    name: JetsJSONLToNumpyTool
    description: Convert a JSONL jets dataset into a zero-padded NumPy array.
    bundle: analysis
  - module: tools.analysis.conversions
    name: LHEToJSONLTool
    description: Convert a MadGraph LHE file into the JSONL (evtjsonl-1.0)
      schema.
    bundle: [analysis, event_gen]
  - module: tools.analysis.kinematics
    name: ApplyCutsTool
    description: Apply kinematic cuts to particles from numpy array or JSONL.
    bundle: analysis
  - module: tools.analysis.kinematics
    name: CalculateDeltaRTool
    description: Calculate Delta R between particles.
    bundle: analysis
  - module: tools.analysis.kinematics
    name: CalculateInvariantMassTool
    description: Calculate the invariant mass of a system of particles.
    bundle: analysis
  - module: tools.analysis.kinematics
    name: CalculateTransverseMomentumTool
    description: Calculate transverse momentum (pT) for particles.
    bundle: analysis
  - module: tools.analysis.kinematics
    name: FilterByDeltaRTool
    description: Remove objects from event arrays based on Delta R proximity to
      other objects.
    bundle: analysis
  - module: tools.analysis.kinematics
    name: FilterByPDGIDTool
    description: Filter particles by PDG ID from JSONL files.
    bundle: analysis
  - module: tools.analysis.kinematics
    name: GetHardestNJetsTool
    description: Extract the N hardest (highest pT) jets from jet clustering
      output.
    bundle: analysis
  - module: tools.analysis.kinematics
    name: GetHardestNTool
    description: Extract the N hardest (highest pT) particles from events.
    bundle: analysis
  - module: tools.analysis.kinematics
    name: MergeObjectCollectionsTool
    description: Merge multiple object collections (particles, jets) into a
      single unified JSONL file.
    bundle: analysis
  - module: tools.analysis.kinematics
    name: SortByPtTool
    description: Sort particles by transverse momentum (pT) in descending order.
    bundle: analysis
  - module: tools.analysis.reconstruction
    name: ResonanceReconstructionTool
    description: Template-based resonance reconstruction tool for combining
      pre-selected particle arrays.
    bundle: analysis
  - module: tools.analysis.cutflow
    name: CutflowTool
    description: Read-only cutflow / selection-sanity diagnostic over a JSONL event
      dataset (per-object multiplicity, per-cut survival, first cut that zeros the sample).
    bundle: analysis
  - module: tools.analysis.normalization
    name: NormalizeYieldTool
    description: Normalize raw MC counts to an expected yield via sigma x lumi / n_generated
      (scalar or per-bin).
    bundle: analysis
  - module: tools.analysis.recast_linter
    name: RecastLinterTool
    description: Presence-only, answer-free self-check for a recast (observable provenance,
      normalization self-consistency, cross-section magnitude, plausible yield, non-empty
      signal region, generation warnings, decay completeness); never consults the reference.
    bundle: analysis
  - module: tools.analysis.benchmark_spectrum
    name: ResolveBenchmarkSpectrumTool
    description: Parse the GeV mass values a SUSY simplified-model benchmark point name
      encodes (e.g. T5Wg_1600_100) so the spectrum is set deliberately, not defaulted;
      echoes only the masses in the task's own point name (no reference/answer leak).
    bundle: bsm
  - module: tools.analysis.slha_decay
    name: BuildDecayTableTool
    description: Build a Pythia-readable decay-table fragment to decay a BSM state the
      LHE left stable (e.g. GMSB neutralino -> photon + gravitino).
    bundle: bsm
  - module: tools.eda.compute_symbolic_amplitude_tool
    name: ComputeSymbolicAmplitude
    description: Generate FeynCalc code with symbolic masses and couplings.
    bundle: eda
  - module: tools.eda.convert_to_python_tool
    name: ConvertToPython
    description: Convert a Mathematica symbolic expression to a Python function.
    bundle: eda
  - module: tools.eda.run_wolfram_tool
    name: RunWolframScript
    description: Execute Mathematica/FeynCalc code via wolframscript.
    bundle: eda
  - module: tools.eda.run_wolfram_tool
    name: RunWolframScriptBatch
    description: Execute multiple Mathematica/FeynCalc scripts concurrently.
    bundle: eda
  - module: tools.eda.simplify_result_tool
    name: SimplifyResult
    description: Simplify, substitute, or take limits of a Mathematica symbolic
      expression.
    bundle: eda
  - module: tools.eda.simplify_result_tool
    name: SimplifyResultBatch
    description: Simplify multiple expressions concurrently.
    bundle: eda
  - module: tools.eda.theory.skills_graph_tool
    name: LookupTheory
    description: Navigate the QFT theory knowledge base (Skills Graph).
    bundle: eda
  - module: tools.feyngraph.enumerate_tool
    name: EnumerateDiagramsTool
    description: Enumerate all Feynman diagrams for a process using FeynGraph.
    bundle: nda
  - module: tools.feyngraph.visualize_tool
    name: VisualizeDiagramsTool
    description: Generate Feynman diagram visualizations using FeynGraph's
      native SVG drawing.
    bundle: nda
  - module: tools.feynrules.feynrules
    name: FeynRulesToUFOTool
    description: Generate a UFO model directory from a FeynRules .fr model file
      by calling Mathematica's `wolframscript`.
    bundle: feynrules
  - module: tools.validate.validate_tool
    name: ValidateModelTool
    description: Compile a .fr model to a UFO and run structural pass/fail
      checks on the result, including a MadGraph import.
    bundle: feynrules
  - module: tools.extract.extract_tool
    name: ExtractLagrangianTool
    description: Extract a structured FeynRules model from BSM paper text
      using an LLM.
    bundle: extract
  - module: tools.frgen.frgen_tool
    name: GenerateFeynRulesModelTool
    description: Generate a FeynRules .fr model file from a structured JSON
      spec.
    bundle: frgen
  - module: tools.reverse.reverse_tool
    name: ReverseLagrangianTool
    description: Blank-slate reverse check of a .fr model. An independent
      agent reconstructs the LaTeX Lagrangian from the sanitized file alone,
      optionally cross-checked against the source paper, packaged for
      physicist sign-off.
    bundle: reverse
  - module: tools.logging.audit_tool
    name: AuditTrailTool
    description: Record, render or read a structured provenance ledger
      (audit.json) of pipeline stages for an end-to-end run.
    bundle: logging
  - module: tools.jobs.jobs_tool
    name: SubmitJobTool
    description: Submit a long-running heptapod tool (UFO compile, full-chain
      validation, MadGraph run, reverse check) as a detached background job
      and get a job_id back immediately.
    bundle: jobs
  - module: tools.jobs.jobs_tool
    name: JobStatusTool
    description: Poll a background job's state (queued, running, done, failed)
      with a log tail, or list all jobs.
    bundle: jobs
  - module: tools.jobs.jobs_tool
    name: JobResultTool
    description: Fetch a finished background job's verbatim tool output.
    bundle: jobs
  - module: tools.inspire.inspire_tools
    name: InspireAuthorTool
    description: Get information about a physicist and their publication
      history.
    bundle: inspire
  - module: tools.inspire.inspire_tools
    name: InspireBibTeXTool
    description: Get BibTeX entry for a paper.
    bundle: inspire
  - module: tools.inspire.inspire_tools
    name: InspireCitationTool
    description: Analyze citations for a paper.
    bundle: inspire
  - module: tools.inspire.inspire_tools
    name: InspireConferenceTool
    description: Search for physics conferences and seminars.
    bundle: inspire
  - module: tools.inspire.inspire_tools
    name: InspireExperimentTool
    description: Search for physics experiments.
    bundle: inspire
  - module: tools.inspire.inspire_tools
    name: InspireInstitutionTool
    description: Search for physics institutions.
    bundle: inspire
  - module: tools.inspire.inspire_tools
    name: InspireJournalTool
    description: Search for physics journals.
    bundle: inspire
  - module: tools.inspire.inspire_tools
    name: InspireNotesTool
    description: Manage notes on INSPIRE papers.
    bundle: inspire
  - module: tools.inspire.inspire_tools
    name: InspirePaperTool
    description: Get detailed information about a specific INSPIRE paper.
    bundle: inspire
  - module: tools.inspire.inspire_tools
    name: InspireReadingListTool
    description: Manage your personal reading list of INSPIRE papers.
    bundle: inspire
  - module: tools.inspire.inspire_tools
    name: InspireSearchTool
    description: Search INSPIRE HEP for physics papers.
    bundle: inspire
  - module: tools.literature.literature_tools
    name: ArxivSearchTool
    description: Search arXiv for physics papers (arXiv ids, PDF links,
      abstracts).
    bundle: literature
  - module: tools.literature.literature_tools
    name: ArxivSourceTool
    description: Fetch a paper's LaTeX source from arXiv (e-print). Preferred
      input for Lagrangian extraction, because PDF text mangles equations.
    bundle: literature
  - module: tools.literature.literature_tools
    name: FetchPaperPDFTool
    description: Download an arXiv paper PDF into the sandbox.
    bundle: literature
  - module: tools.literature.literature_tools
    name: ExtractPaperTextTool
    description: Extract full plain text from a PDF (PyMuPDF) for downstream
      extraction.
    bundle: literature
  - module: tools.mg5.mg5
    name: MadGraphFromRunCardTool
    description: Run MadGraph5_aMC@NLO to generate parton-level events given a
      .mg5 run card template.
    bundle: mg5
  - module: tools.mg5.validate_process
    name: ValidateProcessTool
    description: "FAST (seconds) symbolic check of a MadGraph process + spectrum without\
      \ running event generation — reports whether the process compiles, per-subprocess\
      \ diagram counts (0 = empty decay), and the realized BSM spectrum. Use before\
      \ the multi-minute MadGraphFromRunCard run to converge on the right process/decay/masses."
    bundle: mg5
  - module: tools.nda.branching_ratio_tool
    name: EstimateBranchingRatioNDATool
    description: Estimates branching ratios using NDA for multiple diagram
      classes.
    bundle: nda
  - module: tools.nda.compare_phase_space
    name: ComparePhaseSpaceTool
    description: Compares n-body phase space volumes across different final
      state multiplicities.
    bundle: nda
  - module: tools.nda.matrix_element
    name: EstimateMatrixElementTool
    description: Estimates matrix element squared using dimensional analysis and
      spin counting.
    bundle: nda
  - module: tools.nda.nda_formula_tool
    name: EstimateDecayWidthFormulaNDATool
    description: Returns the NDA scaling formula for a decay process without
      computing
    bundle: nda
  - module: tools.nda.nda_tool
    name: EstimateDecayWidthNDATool
    description: Estimates decay width using Naive Dimensional Analysis -
      Diagram-First Interface.
    bundle: nda
  - module: tools.nda.phase_space
    name: EstimatePhaseSpaceTool
    description: Estimates n-body phase space volume for massless final states.
    bundle: nda
  - module: tools.pdg.pdg_tool
    name: PDGDatabaseTool
    description: Query the Particle Data Group database for particle properties.
    bundle: pdg
  - module: tools.pdg.pdg_tool
    name: PDGPropertyTool
    description: Query a specific PDG property by its PDGID.
    bundle: pdg
  - module: tools.pdg.pdg_tool
    name: PDGSearchTool
    description: Search the PDG database for particles matching a query.
    bundle: pdg
  - module: tools.pythia.pythia
    name: JetClusterSlowJetTool
    description: Cluster jets with Pythia8.SlowJet for a single event.
    bundle: event_gen
  - module: tools.pythia.pythia
    name: PythiaFromRunCardTool
    description: Generate hadron-level events using Pythia8 driven by a provided
      .cmnd run card.
    bundle: event_gen
  - module: tools.sherpa.sherpa
    name: SherpaFromRunCardTool
    description: Generate hadron-level events using Sherpa3 driven by a provided
      .yaml run card.
    bundle: event_gen
  - module: tools.units.metric_prefix_converter
    name: MetricPrefixConverter
    description: Convert between SI metric prefixes for the same base unit.
    bundle: units
  - module: tools.units.natural_units_converter
    name: NaturalUnitsConverter
    description: Convert between natural units (ℏ=c=1) and SI units.
    bundle: units
